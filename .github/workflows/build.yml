name: Build Xed Extension

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Extension Repository
        uses: actions/checkout@v4
        with:
          path: extension

      - name: Checkout Xed-Editor Host Repository
        uses: actions/checkout@v4
        with:
          repository: Xed-Editor/Xed-Editor
          submodules: recursive
          path: Xed-Editor

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Xed-Editor Host Classes for Extension SDK
        run: |
          cd Xed-Editor
          chmod +x gradlew
          ./gradlew :core:main:assembleDebug :core:components:assembleDebug :features:extensions:assembleDebug --no-daemon || true
          cd plugin-sdk
          chmod +x setup.sh
          bash setup.sh
          mkdir -p "$GITHUB_WORKSPACE/extension/libs"
          cp -r libs/* "$GITHUB_WORKSPACE/extension/libs/" || true

      - name: Build Small Caps Extension Package
        run: |
          cd extension
          chmod +x gradlew
          ./gradlew shadowJar buildExtensionPackage --stacktrace --no-daemon

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.lunarenzo.smallcaps-extension-v1.0.0
          path: extension/output/*.zip
          if-no-files-found: error
