name: Build Xed Extension

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Extension Package with Android DEX Bytecode
        run: ./gradlew buildExtensionApk --no-daemon

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.lunarenzo.smallcaps-extension-v1.0.0
          path: output/com.lunarenzo.smallcaps.zip
          if-no-files-found: error
